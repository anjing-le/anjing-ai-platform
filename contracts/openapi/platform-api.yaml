components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: demo-token or session-token
    apiKeyAuth:
      type: apiKey
      in: header
      name: X-API-Key
  responses:
    HealthOK:
      description: Service is healthy.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/HealthResponse"
    BadRequest:
      description: Request validation failed.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    Unauthorized:
      description: Missing or invalid credential.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    Forbidden:
      description: Credential is valid but the role is not allowed.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    NotFound:
      description: Resource not found.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    TooManyRequests:
      description: Request exceeded the configured route rate limit.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    BadGateway:
      description: Upstream request failed.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
  schemas:
    SuccessEnvelope:
      type: object
      required: [success]
      properties:
        success:
          type: boolean
          const: true
        data:
          description: Operation payload.
    ErrorEnvelope:
      type: object
      required: [success, error]
      properties:
        success:
          type: boolean
          const: false
        error:
          $ref: "#/components/schemas/APIError"
    APIError:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
          examples: [bad_request, unauthorized, forbidden, not_found, internal_error]
        message:
          type: string
    Principal:
      type: object
      required: [subject, role, method]
      properties:
        subject:
          type: string
        role:
          type: string
          enum: [Administrator, User, Developer, Operator]
        method:
          type: string
          enum: [bearer, api_key, permissive, passwordless, session]
    AuthLoginRequest:
      type: object
      required: [email]
      properties:
        email:
          type: string
          format: email
        role:
          type: string
          enum: [Administrator, User, Developer, Operator]
          description: Optional dev profile role when the email is not in the seed user store.
    AuthSession:
      type: object
      required: [token, principal, expiresAt]
      properties:
        token:
          type: string
          description: Signed local session token.
        principal:
          $ref: "#/components/schemas/Principal"
        expiresAt:
          type: string
          format: date-time
    AuthSessionStatus:
      type: object
      required: [authenticated, principal]
      properties:
        authenticated:
          type: boolean
        principal:
          $ref: "#/components/schemas/Principal"
    AuthLogoutRequest:
      type: object
      additionalProperties: false
    AuthLogoutResponse:
      type: object
      required: [revoked]
      properties:
        revoked:
          type: boolean
    HealthResponse:
      allOf:
        - $ref: "#/components/schemas/SuccessEnvelope"
        - type: object
          properties:
            data:
              type: object
              properties:
                service:
                  type: string
                status:
                  type: string
                time:
                  type: string
                  format: date-time
    Metric:
      type: object
      required: [label, value, note]
      properties:
        label:
          type: string
        value:
          type: string
        note:
          type: string
    User:
      type: object
      required: [id, email, org, role, mfa, status, createdAt]
      properties:
        id:
          type: string
        email:
          type: string
          format: email
        org:
          type: string
        role:
          type: string
          enum: [Administrator, User, Developer, Operator]
        mfa:
          type: string
        status:
          type: string
        createdAt:
          type: string
    CreateUserRequest:
      type: object
      required: [email]
      properties:
        email:
          type: string
          format: email
        org:
          type: string
          default: Platform
        role:
          type: string
          enum: [Administrator, User, Developer, Operator]
          default: User
    ActivateUserRequest:
      type: object
      required: [id]
      properties:
        id:
          type: string
    Application:
      type: object
      required: [id, name, owner, environment, apiKey, defaultRoute, plan, status, createdAt]
      properties:
        id:
          type: string
        name:
          type: string
        owner:
          type: string
        environment:
          type: string
          enum: [Sandbox, Production]
        apiKey:
          type: string
        defaultRoute:
          type: string
        plan:
          type: string
        status:
          type: string
        createdAt:
          type: string
    CreateApplicationRequest:
      type: object
      required: [name, owner]
      properties:
        name:
          type: string
        owner:
          type: string
          format: email
        environment:
          type: string
          enum: [Sandbox, Production]
          default: Sandbox
        defaultRoute:
          type: string
          default: /api/v1/llm/**
        plan:
          type: string
          default: Free
    ActivateApplicationRequest:
      type: object
      required: [id]
      properties:
        id:
          type: string
    RotateApplicationKeyRequest:
      type: object
      required: [id]
      properties:
        id:
          type: string
    RolePolicy:
      type: object
      required: [id, name, visibleEntries, configScope, restriction, status]
      properties:
        id:
          type: string
        name:
          type: string
        visibleEntries:
          type: string
        configScope:
          type: string
        restriction:
          type: string
        status:
          type: string
    APIKey:
      type: object
      required: [id, name, project, scope, expiresAt, status, maskedPreview, lastUsedAt, rotatedAt, revokedAt]
      properties:
        id:
          type: string
        name:
          type: string
        project:
          type: string
        scope:
          type: string
        expiresAt:
          type: string
        status:
          type: string
        maskedPreview:
          type: string
        lastUsedAt:
          type: string
