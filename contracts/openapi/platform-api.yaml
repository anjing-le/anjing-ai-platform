openapi: 3.1.0
info:
  title: Anjing AI Platform API
  version: 0.1.0
  summary: V1 control, gateway, billing and operations API contract.
  description: >
    Anjing AI Platform V1 keeps a modular Go service boundary while allowing
    local development through the platform-all command. Business APIs return a
    unified envelope and can be protected by Bearer token or X-API-Key when
    ANJING_AUTH_MODE=enforced. The x-anjing-service-boundaries extension is the
    contract between console entries, owner commands and API groups; it is
    verified against the frontend consoleServiceMap during pnpm verify.
servers:
  - url: http://localhost:18080
    description: platform-all local server
  - url: http://localhost:1820
    description: control-api local server
  - url: http://localhost:1821
    description: gateway-api local server
  - url: http://localhost:1822
    description: billing-service local server
  - url: http://localhost:1823
    description: ops-api local server
security:
  - bearerAuth: []
  - apiKeyAuth: []
tags:
  - name: platform
    description: Shared runtime health.
  - name: control
    description: Applications, users, role policies, API keys and credential references.
  - name: gateway
    description: API routes, model routes, skill bindings and request logs.
  - name: billing
    description: Plans, usage records and budget alerts.
  - name: operations
    description: Dashboard, todos, service health and audit events.
x-anjing-service-boundaries:
  - consoleEntry: operations
    label: 运营总览
    owner: ops-api
    apiGroups:
      - /api/ops/platform-snapshot
      - /api/ops/dashboard
      - /api/ops/todos
      - /api/ops/audit-events
  - consoleEntry: access
    label: 用户与权限
    owner: control-api
    apiGroups:
      - /api/control/users
      - /api/control/applications
      - /api/control/api-keys
  - consoleEntry: gateway
    label: 网关与模型
    owner: gateway-api
    apiGroups:
      - /api/gateway/routes
      - /api/gateway/model-routes
      - /api/gateway/proxy
      - /api/gateway/llm/invoke
      - /api/gateway/llm/stream
  - consoleEntry: billing
    label: 计费与配额
    owner: billing-service
    apiGroups:
      - /api/billing/plans
      - /api/billing/usage
      - /api/billing/invoices
      - /api/billing/usage-events
      - /api/billing/budget-alerts
  - consoleEntry: docs
    label: 帮助文档
    owner: console-web + APIs
    apiGroups:
      - /
      - /api/*
paths:
  /healthz:
    get:
      tags: [platform]
      operationId: getPlatformHealth
      summary: Platform health check.
      security: []
      responses:
        "200":
          description: Service is healthy.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
  /api/control/healthz:
    get:
      tags: [control]
      operationId: getControlHealth
      summary: Control API health check.
      security: []
      responses:
        "200":
          $ref: "#/components/responses/HealthOK"
  /api/control/auth/login:
    post:
      tags: [control]
      operationId: loginControlSession
      summary: Create a local console session.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AuthLoginRequest"
      responses:
        "200":
          description: Session created.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessEnvelope"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/AuthSession"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/control/auth/session:
    get:
      tags: [control]
      operationId: getControlSession
      summary: Get the current console session.
      x-anjing-roles: [Administrator, User, Developer, Operator]
      responses:
        "200":
          description: Session returned.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessEnvelope"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/AuthSessionStatus"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /api/control/auth/logout:
    post:
      tags: [control]
      operationId: logoutControlSession
      summary: Revoke the current console session.
      x-anjing-roles: [Administrator, User, Developer, Operator]
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AuthLogoutRequest"
      responses:
        "200":
          description: Session revoked.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessEnvelope"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/AuthLogoutResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /api/control/users:
    get:
      tags: [control]
      operationId: listUsers
      summary: List console users.
      x-anjing-roles: [Administrator]
      responses:
        "200":
          description: Users returned.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessEnvelope"
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: "#/components/schemas/User"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
    post:
      tags: [control]
      operationId: createUser
      summary: Invite a new console user.
      x-anjing-roles: [Administrator]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateUserRequest"
      responses:
        "201":
          description: User invited.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessEnvelope"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/User"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /api/control/users/activate:
    post:
      tags: [control]
      operationId: activateUser
      summary: Activate an invited console user.
      x-anjing-roles: [Administrator]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ActivateUserRequest"
      responses:
        "200":
          description: User activated.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessEnvelope"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/User"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/control/applications:
    get:
      tags: [control]
      operationId: listApplications
      summary: List onboarding applications.
      x-anjing-roles: [Administrator, User, Developer]
      responses:
        "200":
          description: Applications returned.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessEnvelope"
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: "#/components/schemas/Application"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
    post:
      tags: [control]
      operationId: createApplication
      summary: Create an onboarding application and default API key reference.
      x-anjing-roles: [Administrator, User, Developer]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateApplicationRequest"
      responses:
        "201":
          description: Application created.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessEnvelope"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/Application"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /api/control/applications/activate:
    post:
      tags: [control]
      operationId: activateApplication
      summary: Mark an onboarding application as active after validation.
      x-anjing-roles: [Administrator, User, Developer]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ActivateApplicationRequest"
      responses:
        "200":
          description: Application activated.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessEnvelope"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/Application"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/control/applications/rotate-key:
    post:
      tags: [control]
      operationId: rotateApplicationKey
      summary: Rotate the default API key for an onboarding application.
      x-anjing-roles: [Administrator, User, Developer]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RotateApplicationKeyRequest"
      responses:
        "200":
          description: Application API key rotated.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessEnvelope"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/Application"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/control/roles:
    get:
      tags: [control]
      operationId: listRolePolicies
      summary: List role policies.
      x-anjing-roles: [Administrator, Developer]
      responses:
        "200":
          description: Role policies returned.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessEnvelope"
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: "#/components/schemas/RolePolicy"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /api/control/api-keys:
    get:
      tags: [control]
      operationId: listAPIKeys
      summary: List masked API keys.
      x-anjing-roles: [Administrator, Developer]
      responses:
        "200":
          description: API keys returned.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessEnvelope"
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: "#/components/schemas/APIKey"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /api/control/api-keys/revoke:
    post:
      tags: [control]
      operationId: revokeAPIKey
      summary: Revoke an API key.
      x-anjing-roles: [Administrator]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RevokeAPIKeyRequest"
      responses:
        "200":
          description: API key revoked.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessEnvelope"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/APIKey"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/control/credentials:
    get:
      tags: [control]
      operationId: listCredentials
      summary: List credential references.
      x-anjing-roles: [Administrator, Developer]
      responses:
        "200":
          description: Credential references returned.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessEnvelope"
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: "#/components/schemas/Credential"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /api/control/credentials/rotate:
    post:
      tags: [control]
      operationId: rotateCredential
      summary: Rotate a credential reference and return the new active ref.
      x-anjing-roles: [Administrator]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RotateCredentialRequest"
      responses:
        "200":
          description: Credential rotated.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessEnvelope"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/Credential"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/gateway/healthz:
    get:
      tags: [gateway]
      operationId: getGatewayHealth
      summary: Gateway API health check.
      security: []
      responses:
        "200":
          $ref: "#/components/responses/HealthOK"
  /api/gateway/routes:
    get:
      tags: [gateway]
      operationId: listGatewayRoutes
      summary: List API gateway routes.
      x-anjing-roles: [Administrator, Developer]
      responses:
        "200":
          description: Gateway routes returned.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessEnvelope"
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: "#/components/schemas/GatewayRoute"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
    post:
      tags: [gateway]
      operationId: createGatewayRoute
      summary: Create a gateway route draft.
      x-anjing-roles: [Administrator, Developer]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateGatewayRouteRequest"
      responses:
        "201":
          description: Gateway route created.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessEnvelope"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/GatewayRoute"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /api/gateway/routes/publish:
    post:
      tags: [gateway]
      operationId: publishGatewayRoute
      summary: Publish a gateway route draft.
      x-anjing-roles: [Administrator, Developer]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PublishGatewayRouteRequest"
      responses:
        "200":
          description: Gateway route published.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessEnvelope"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/GatewayRoute"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/gateway/model-routes:
    get:
      tags: [gateway]
      operationId: listModelRoutes
      summary: List model route aliases.
      x-anjing-roles: [Administrator, Developer]
      responses:
        "200":
          description: Model routes returned.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessEnvelope"
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: "#/components/schemas/ModelRoute"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
    post:
      tags: [gateway]
      operationId: createModelRoute
      summary: Create a model route alias draft.
      x-anjing-roles: [Administrator, Developer]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateModelRouteRequest"
      responses:
        "201":
          description: Model route created.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessEnvelope"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/ModelRoute"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /api/gateway/model-routes/publish:
    post:
      tags: [gateway]
      operationId: publishModelRoute
      summary: Publish a model route alias draft.
      x-anjing-roles: [Administrator, Developer]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PublishModelRouteRequest"
      responses:
        "200":
          description: Model route published.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessEnvelope"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/ModelRoute"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/gateway/skills:
    get:
      tags: [gateway]
      operationId: listSkillBindings
      summary: List skill bindings.
      x-anjing-roles: [Administrator, Developer]
      responses:
        "200":
          description: Skill bindings returned.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessEnvelope"
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: "#/components/schemas/SkillBinding"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
    post:
      tags: [gateway]
      operationId: createSkillBinding
      summary: Create a skill binding draft.
      x-anjing-roles: [Administrator, Developer]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateSkillBindingRequest"
      responses:
        "201":
          description: Skill binding created.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessEnvelope"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/SkillBinding"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /api/gateway/skills/publish:
    post:
      tags: [gateway]
      operationId: publishSkillBinding
      summary: Publish a skill binding draft.
      x-anjing-roles: [Administrator, Developer]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PublishSkillBindingRequest"
      responses:
        "200":
          description: Skill binding published.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessEnvelope"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/SkillBinding"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/gateway/skills/invoke:
    post:
      tags: [gateway]
      operationId: invokeSkill
      summary: Invoke a published skill binding.
      description: >
        V1 resolves a Published skill binding by name and executes it through a
        replaceable adapter. Built-in bindings validate input against the
        declared schemaVersion before dispatch. The endpoint records request
        logs and successful skill-call usage so the console can validate
        integration flow before real Skill provider protocols are wired in.
      x-anjing-roles: [Administrator, User, Developer]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SkillInvokeRequest"
      responses:
        "200":
          description: Skill invocation completed.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessEnvelope"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/SkillInvokeResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "502":
          $ref: "#/components/responses/BadGateway"
  /api/gateway/request-logs:
    get:
      tags: [gateway]
      operationId: listRequestLogs
      summary: List request logs.
      x-anjing-roles: [Administrator, Developer, Operator]
      parameters:
        - in: query
          name: q
          schema:
            type: string
          description: Match request, consumer or result text.
        - in: query
          name: consumer
          schema:
            type: string
          description: Filter by exact consumer name.
        - in: query
          name: status
          schema:
            type: string
          description: Filter by exact request status.
        - in: query
          name: limit
          schema:
            type: integer
            minimum: 1
            maximum: 500
          description: Maximum number of request logs to return.
      responses:
        "200":
          description: Request logs returned.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessEnvelope"
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: "#/components/schemas/RequestLog"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /api/gateway/request-logs/export:
    get:
      tags: [gateway]
      operationId: exportRequestLogs
      summary: Export request logs as CSV.
      x-anjing-roles: [Administrator, Developer, Operator]
      parameters:
        - in: query
          name: q
          schema:
            type: string
          description: Match request, consumer or result text.
        - in: query
          name: consumer
          schema:
            type: string
          description: Filter by exact consumer name.
        - in: query
          name: status
          schema:
            type: string
          description: Filter by exact request status.
        - in: query
          name: limit
          schema:
            type: integer
            minimum: 1
            maximum: 500
          description: Maximum number of request logs to export. Defaults to 500.
      responses:
        "200":
          description: Request logs CSV returned.
          content:
            text/csv:
              schema:
                type: string
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /api/gateway/request-logs/retention/purge:
    post:
      tags: [gateway]
      operationId: purgeRequestLogsByRetention
      summary: Purge request logs by retention policy.
      x-anjing-roles: [Administrator, Operator]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RetentionPurgeRequest"
      responses:
