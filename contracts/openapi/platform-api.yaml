        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /api/gateway/proxy:
    post:
      tags: [gateway]
      operationId: proxyGatewayRequest
      summary: Proxy an HTTP request through a configured gateway route or explicit upstream.
      description: >
        Executes the V1 gateway runtime path with timeout, bounded retries,
        optional fallback upstream, published route rate limits and request log
        recording. Streaming remains on the V1.2 backlog.
      x-anjing-roles: [Administrator, User, Developer]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GatewayProxyRequest"
      responses:
        "200":
          description: Gateway proxy completed.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessEnvelope"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/GatewayProxyResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "502":
          $ref: "#/components/responses/BadGateway"
  /api/gateway/llm/invoke:
    post:
      tags: [gateway]
      operationId: invokeLLM
      summary: Invoke an LLM through the model route gateway.
      description: >
        V1 starts with a replaceable mock provider adapter. The endpoint resolves
        active model route aliases, tries the primary model first, falls back to
        the configured backup model when the adapter reports a provider failure,
        records request logs and usage records, and returns token usage so the
        console, examples and future SDKs can integrate against a stable boundary
        before real providers are wired in.
      x-anjing-roles: [Administrator, User, Developer]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LLMInvokeRequest"
      responses:
        "200":
          description: LLM invocation completed.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessEnvelope"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/LLMInvokeResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "502":
          $ref: "#/components/responses/BadGateway"
  /api/gateway/llm/stream:
    post:
      tags: [gateway]
      operationId: streamLLM
      summary: Stream an LLM response through the model route gateway.
      description: >
        Provides the V1 streaming contract for LLM calls. The current
        implementation uses the same replaceable provider adapter, active model
        route resolution, primary/fallback selection, request logging and usage
        recording as the JSON invocation endpoint, then emits Server-Sent Events
        with meta, delta and done events. Real provider-native streaming can
        replace the mock adapter without changing this API boundary.
      x-anjing-roles: [Administrator, User, Developer]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LLMInvokeRequest"
      responses:
        "200":
          description: LLM response stream.
          content:
            text/event-stream:
              schema:
                type: string
                description: >
                  Server-Sent Events. Emits event: meta, one or more event:
                  delta frames, and event: done with final usage metadata.
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "502":
          $ref: "#/components/responses/BadGateway"
