        route:
          type: string
        upstream:
          type: string
        auth:
          type: string
        limit:
          type: string
        status:
          type: string
        updatedAt:
          type: string
    CreateGatewayRouteRequest:
      type: object
      required: [route]
      properties:
        route:
          type: string
          examples: [/api/v1/llm/**]
        upstream:
          type: string
          default: gateway-api
        limit:
          type: string
          default: 600/min
    PublishGatewayRouteRequest:
      type: object
      required: [id]
      properties:
        id:
          type: string
    GatewayProxyRequest:
      type: object
      required: [route]
      properties:
        route:
          type: string
          examples: [/api/v1/demo/ping]
        method:
          type: string
          enum: [GET, POST, PUT, PATCH, DELETE]
          default: POST
        upstream:
          type: string
          description: Optional explicit http/https upstream. If omitted, the gateway resolves an active route.
        fallbackUpstream:
          type: string
          description: Optional fallback upstream used after primary retries fail.
        timeoutMs:
          type: integer
          minimum: 0
          maximum: 30000
          default: 3000
        retries:
          type: integer
          minimum: 0
          maximum: 3
          default: 0
        headers:
          type: object
          additionalProperties:
            type: string
        body:
          type: string
    GatewayProxyResponse:
      type: object
      required: [route, upstream, statusCode, attempts, fallback, durationMs, headers, body]
      properties:
        route:
          type: string
        upstream:
          type: string
        statusCode:
          type: integer
        attempts:
          type: integer
        fallback:
          type: boolean
        durationMs:
          type: integer
          format: int64
        headers:
          type: object
          additionalProperties:
            type: array
            items:
              type: string
        body:
          type: string
    ModelRoute:
      type: object
      required: [id, alias, scenario, primary, fallback, status, updatedAt]
      properties:
